kind = "web"
previewPath = "/"
title = "Novadent 諾星牙科平台"
version = "1.0.0"
id = "artifacts/novadent-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 3001

[services.development]
run = "cd /home/runner/workspace/novadent/backend && NODE_ENV=production node dist/src/main.js"

[services.production]

[services.production.build]
args = ["bash", "-c", "cd /home/runner/workspace/novadent && npm run build && cd /home/runner/workspace/novadent/backend && NODE_ENV=development ./node_modules/.bin/nest build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "novadent/backend/dist/src/main.js"]

[services.production.run.env]
NODE_ENV = "production"

[services.env]
PORT = "3001"
