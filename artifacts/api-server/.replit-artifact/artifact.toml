kind = "api"
previewPath = "/api-backend/"
title = "Novadent"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 3001
name = "API Server"
paths = ["/api-backend/"]

[services.development]
run = "cd /home/runner/workspace/novadent/backend && NODE_ENV=production node dist/src/main.js"

[services.production]
build = ["bash", "-c", "cd /home/runner/workspace/novadent && npm install --legacy-peer-deps && npm run build && cd /home/runner/workspace/novadent/backend && npm install --legacy-peer-deps && npx tsc -p tsconfig.json || true"]
run = "cd /home/runner/workspace/novadent/backend && NODE_ENV=production node dist/src/main.js"

[services.env]
NODE_ENV = "production"
