kind = "web"
previewPath = "/"
title = "Novadent 諾星牙科平台"
version = "1.0.0"
id = "artifacts/novadent-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = ["/"]
localPort = 24505

[services.development]
run = "cd /home/runner/workspace/novadent/backend && NODE_ENV=production node dist/src/main.js"

[services.production]
build = ["bash", "-c", "cd /home/runner/workspace/novadent && npm install --legacy-peer-deps && npx vite build && cd /home/runner/workspace/novadent/backend && npm install --legacy-peer-deps && npx tsc -p tsconfig.json || true"]
run = "cd /home/runner/workspace/novadent/backend && NODE_ENV=production node dist/src/main.js"

[services.env]
PORT = "24505"
